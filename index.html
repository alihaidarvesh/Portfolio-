<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Director & Brand Identity</title>
    <style>
        /* Modern Portfolio CSS with Bold Gradients & Dynamic UI */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-orange: #FF6B35;
            --secondary-orange: #FF8C42;
            --dark-bg: #1a0f0f;
            --darker-bg: #0f0a0a;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --text-light: rgba(255, 255, 255, 0.8);
            --accent-glow: rgba(255, 107, 53, 0.3);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--darker-bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 4rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 2rem;
            }
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            background: rgba(15, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease;
        }

        .nav-brand {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-cta {
            background: var(--white);
            color: var(--dark-bg) !important;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: var(--primary-orange);
            color: var(--white) !important;
            transform: translateY(-2px);
        }

        .arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .nav-cta:hover .arrow {
            transform: translateX(5px);
        }

        /* Mobile Menu */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav {
                padding: 1.5rem 2rem;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 80px;
                left: 0;
                right: 0;
                background: rgba(15, 10, 10, 0.98);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                opacity: 0;
                transition: all 0.3s ease;
                pointer-events: none;
            }

            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: all;
            }
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            position: relative;
            padding: 8rem 4rem 4rem;
            overflow: hidden;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                var(--primary-orange) 0%, 
                #d94a2f 50%, 
                var(--dark-bg) 100%);
            opacity: 0.9;
            z-index: 0;
        }

        .hero-background::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 150%;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.2) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-50px, -50px) rotate(5deg); }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-label {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .hero-title {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 800;
            line-height: 0.95;
            margin-bottom: 3rem;
            letter-spacing: -0.03em;
        }

        .hero-services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .service-number {
            font-size: 0.85rem;
            opacity: 0.6;
            font-weight: 600;
        }

        .service-name {
            font-size: 1rem;
            font-weight: 500;
        }

        .hero-right {
            display: flex;
            align-items: center;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .hero-card h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .hero-card p {
            opacity: 0.9;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .trusted-section {
            position: relative;
            z-index: 2;
            margin-top: 6rem;
            text-align: center;
        }

        .trusted-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .brand-logos {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .brand-logo:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        @media (max-width: 968px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            
            .hero {
                padding: 6rem 2rem 3rem;
            }

            .hero-services {
                grid-template-columns: 1fr;
            }
        }

        /* Philosophy Section */
        .philosophy {
            background: var(--darker-bg);
            padding: 8rem 0;
            position: relative;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-orange);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .philosophy-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-bottom: 6rem;
        }

        .large-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .philosophy-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: var(--text-light);
        }

        .philosophy-subtext {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        .cta-button {
            background: var(--primary-orange);
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .cta-button:hover {
            background: var(--secondary-orange);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px var(--accent-glow);
        }

        .cta-button.large {
            padding: 1.3rem 3rem;
            font-size: 1.1rem;
        }

        .cta-button:hover .arrow {
            transform: translateX(5px);
        }

        .portfolio-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .preview-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 3/4;
            cursor: pointer;
        }

        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .preview-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            transform: translateY(100%);
            transition: transform 0.4s ease;
        }

        .preview-card:hover .preview-overlay {
            transform: translateY(0);
        }

        .preview-card:hover img {
            transform: scale(1.1);
        }

        .preview-overlay h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .preview-overlay p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 968px) {
            .philosophy-content {
                grid-template-columns: 1fr;
            }
            
            .portfolio-preview {
                grid-template-columns: 1fr;
            }
        }

        /* Work Section */
        .work {
            background: var(--dark-bg);
            padding: 8rem 0;
        }

        .work-header {
            text-align: center;
            margin-bottom: 6rem;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .project-card {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 4rem;
            margin-bottom: 8rem;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .project-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .project-card.reverse {
            grid-template-columns: 1fr 1.2fr;
        }

        .project-card.reverse .project-image {
            order: 2;
        }

        .project-card.reverse .project-details {
            order: 1;
        }

        .project-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/10;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .project-badge {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: var(--white);
            color: var(--dark-bg);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .project-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .project-description {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .project-link {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .project-link:hover {
            background: var(--white);
            color: var(--dark-bg);
            transform: translateY(-3px);
        }

        .project-link:hover .arrow {
            transform: translateX(5px);
        }

        @media (max-width: 968px) {
            .project-card,
            .project-card.reverse {
                grid-template-columns: 1fr;
            }
            
            .project-card.reverse .project-image,
            .project-card.reverse .project-details {
                order: unset;
            }

            .project-title {
                font-size: 1.8rem;
            }
        }

        /* About Section */
        .about {
            background: var(--darker-bg);
            padding: 8rem 0;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            margin-bottom: 6rem;
        }

        .about-content p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .about-recognition {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 107, 53, 0.05);
            border-left: 3px solid var(--primary-orange);
            border-radius: 10px;
        }

        .about-recognition h4 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .about-recognition ul {
            list-style: none;
        }

        .about-recognition li {
            padding: 0.5rem 0;
            opacity: 0.9;
        }

        .about-image {
            position: relative;
        }

        .about-image img {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 20px;
        }

        .about-callout {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            right: 2rem;
            background: rgba(255, 107, 53, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .about-callout p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            font-weight: 500;
        }

        .calligraphy-showcase h3 {
            font-size: 2rem;
            margin-bottom: 3rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .showcase-grid img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.4s ease;
        }

        .showcase-grid img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 968px) {
            .about-grid {
                grid-template-columns: 1fr;
            }
            
            .showcase-grid {
                grid-template-columns: 1fr;
            }

            .about-image img {
                height: 400px;
            }
        }

        /* Contact Section */
        .contact {
            background: var(--dark-bg);
            padding: 8rem 0;
            text-align: center;
        }

        .contact-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .contact-subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 4rem;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 4rem;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }

        .contact-card h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            opacity: 0.7;
            font-weight: 500;
        }

        .contact-card a {
            color: var(--white);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Footer */
        .footer {
            background: var(--darker-bg);
            padding: 4rem 0 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-content {
            display: flex;
            justify-content: space-between
